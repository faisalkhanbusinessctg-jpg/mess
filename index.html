<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>মেস হিসাব</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap');

* { box-sizing: border-box; }

html, body {
  overscroll-behavior-y: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
body {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
#mh-root input, #mh-root textarea, #mh-root select {
  -webkit-user-select: text; user-select: text;
}

#mh-root {
  --paper: #F7F1E2;
  --paper-dark: #EFE5C9;
  --card: #FFFDF7;
  --card-highlight: #FFFFFF;
  --ink: #2B2620;
  --ink-soft: #7A6F5C;
  --rule: #CBBFA0;
  --green: #2F6F4E;
  --green-hi: #3E8862;
  --green-shadow: #1F4C34;
  --green-soft: #E3EEE6;
  --rust: #B5482F;
  --rust-soft: #F6E4DD;
  --gold: #D9A441;
  --gold-dark: #B9852A;
  --navy: #2B3A55;
  --cover: #2B2620;
  --header-1: #2F6F4E;
  --header-2: #1F4D37;
  --header-line: rgba(217,164,65,0.18);
  font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100%;
  padding: 0;
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s ease, color 0.2s ease;
}

#mh-root.mh-dark {
  --paper: #1E1B16;
  --paper-dark: #262119;
  --card: #2A251E;
  --card-highlight: #342E24;
  --ink: #ECE4D2;
  --ink-soft: #A79A82;
  --rule: #453E30;
  --green: #55B685;
  --green-hi: #71CC9E;
  --green-shadow: #163625;
  --green-soft: #203327;
  --rust: #E4886A;
  --rust-soft: #3A2620;
  --gold: #ECBE68;
  --gold-dark: #C99A3E;
  --navy: #8FA8D0;
  --cover: #131110;
  --header-1: #1B3327;
  --header-2: #0F1F18;
  --header-line: rgba(236,190,104,0.14);
}

#mh-root .mh-serif { font-family: 'Tiro Bangla', 'Noto Serif Bengali', serif; }
#mh-root .mh-mono { font-family: 'Roboto Mono', monospace; }

#mh-root .mh-shell { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }

/* ---------- HEADER ---------- */
#mh-root .mh-header {
  background: var(--header-2);
  background-image: linear-gradient(135deg, var(--header-1) 0%, var(--header-2) 100%);
  border-radius: 14px;
  padding: 18px 18px 16px;
  color: var(--paper);
  position: relative;
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: 0 8px 20px -10px rgba(31,77,55,0.45);
}
#mh-root .mh-header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
  opacity: 0.85;
}
#mh-root .mh-header::after {
  content: '';
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(90deg, var(--header-line) 0 1px, transparent 1px 22px);
  pointer-events: none;
}
#mh-root .mh-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#mh-root .mh-title { font-family: 'Tiro Bangla', serif; font-size: 22px; letter-spacing: 0.3px; color: var(--gold); }
#mh-root .mh-subtitle { font-size: 12px; color: #D8CFB8; margin-top: 2px; }
#mh-root .mh-lock-btn {
  background: rgba(217,164,65,0.15);
  border: 1px solid rgba(217,164,65,0.5);
  color: var(--gold);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 12.5px;
  font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  cursor: pointer;
}
#mh-root .mh-lock-btn.on { background: var(--green); border-color: var(--green); color: #fff; }
#mh-root .mh-header-actions { display:flex; align-items:center; gap:8px; }
#mh-root .mh-icon-round-btn {
  background: rgba(217,164,65,0.15);
  border: 1px solid rgba(217,164,65,0.5);
  color: var(--gold);
  border-radius: 999px;
  width: 32px; height: 32px;
  display:flex; align-items:center; justify-content:center;
  font-size: 14px;
  cursor: pointer;
}
#mh-root .mh-icon-round-btn.active { background: var(--gold); color: var(--cover); }

#mh-root .mh-manager-badge {
  margin-top: 10px; font-size: 12px; color: #EADFC0; background: rgba(217,164,65,0.12);
  border: 1px solid rgba(217,164,65,0.35); border-radius: 8px; padding: 6px 10px; display:inline-block;
}
#mh-root .mh-manager-badge b { color: var(--gold); font-weight:700; }

#mh-root .mh-month-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; background: rgba(255,255,255,0.06);
  border-radius: 10px; padding: 6px 6px;
}
#mh-root .mh-month-btn {
  background: transparent; border: none; color: var(--paper);
  font-size: 18px; padding: 4px 12px; cursor: pointer; border-radius: 8px;
}
#mh-root .mh-month-btn:active { background: rgba(255,255,255,0.1); }
#mh-root .mh-month-label { font-family: 'Tiro Bangla', serif; font-size: 15.5px; color: #fff; }

#mh-root .mh-sync-row { display:flex; align-items:center; gap:6px; font-size:11px; color:#B8AE95; margin-top:8px; }
#mh-root .mh-sync-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(47,111,78,0.6); animation: mh-pulse 2s infinite; }
@keyframes mh-pulse { 0%{box-shadow:0 0 0 0 rgba(47,111,78,0.5);} 70%{box-shadow:0 0 0 6px rgba(47,111,78,0);} 100%{box-shadow:0 0 0 0 rgba(47,111,78,0);} }

/* ---------- BOTTOM NAV ---------- */
#mh-bottom-nav {
  position: fixed; left:0; right:0; bottom:0; z-index: 60;
  display: flex; gap: 2px; max-width: 720px; margin: 0 auto;
  background: var(--header-2);
  background-image: linear-gradient(135deg, var(--header-1) 0%, var(--header-2) 100%);
  padding: 8px 4px calc(7px + env(safe-area-inset-bottom));
  box-shadow: 0 -6px 20px rgba(0,0,0,0.28);
}
#mh-bottom-nav::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
  opacity: 0.85;
}
#mh-bottom-nav .mh-nav-item {
  flex: 1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 3px;
  background:none; border:none; color: rgba(217,164,65,0.55); font-size: 9.5px; font-weight:700; cursor:pointer;
  padding: 7px 1px 6px; border-radius: 13px; min-width:0; position:relative;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition: color 0.15s ease, background 0.15s ease, transform 0.12s ease;
}
#mh-bottom-nav .mh-nav-icon-wrap {
  display:flex; align-items:center; justify-content:center;
  width: 30px; height: 30px; border-radius: 50%;
  transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}
#mh-bottom-nav .mh-nav-icon {
  font-size: 18px; line-height:1; opacity:0.78;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35));
  transition: opacity 0.15s ease, filter 0.15s ease, transform 0.15s ease;
}
#mh-bottom-nav .mh-nav-label { max-width:100%; overflow:hidden; text-overflow:ellipsis; letter-spacing:0.15px; }
#mh-bottom-nav .mh-nav-item.active { color: var(--gold); }
#mh-bottom-nav .mh-nav-item.active .mh-nav-icon-wrap {
  background: radial-gradient(circle, rgba(217,164,65,0.35) 0%, rgba(217,164,65,0.16) 65%, transparent 100%);
  box-shadow: 0 2px 8px rgba(217,164,65,0.35), inset 0 0 0 1px rgba(217,164,65,0.4);
  transform: translateY(-1px);
}
#mh-bottom-nav .mh-nav-item.active .mh-nav-icon {
  opacity:1; transform: scale(1.14);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)) drop-shadow(0 0 6px rgba(217,164,65,0.5));
}
#mh-bottom-nav .mh-nav-item:active { transform: scale(0.92); }
#mh-tab-content { padding-bottom: 86px; }

@keyframes mh-tab-slide { from { opacity:0; transform: translateX(14px); } to { opacity:1; transform: translateX(0); } }
#mh-root .mh-tab-anim { animation: mh-tab-slide 0.22s ease; }

/* ---------- CARDS / SECTIONS ---------- */
#mh-root .mh-section-title {
  font-family: 'Tiro Bangla', serif; font-size: 17px; margin: 4px 0 10px; display:flex; align-items:center; gap:8px;
}
#mh-root .mh-section-title .mh-eyebrow {
  font-family: 'Hind Siliguri', sans-serif; font-size: 10.5px; letter-spacing: 0.5px; color: var(--gold-dark);
  background: #F1DFB4; padding: 2px 8px; border-radius: 5px; font-weight:700;
}
#mh-root .mh-card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px;
  margin-bottom: 14px; box-shadow: 0 2px 10px rgba(43,38,32,0.06);
}

/* summary stat strip */
#mh-root .mh-stat-strip { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom:16px; }
#mh-root .mh-stat { background: var(--card); border:1px solid var(--rule); border-radius:12px; padding:12px 8px; text-align:center; box-shadow: 0 2px 8px rgba(43,38,32,0.06); }
#mh-root .mh-stat .mh-stat-num { font-family:'Roboto Mono',monospace; font-size:15px; font-weight:700; color:var(--navy); }
#mh-root .mh-stat .mh-stat-label { font-size:10px; color:var(--ink-soft); margin-top:2px; }

/* remaining-fund hero */
#mh-root .mh-fund-card { border:1.5px solid var(--rule); border-radius:16px; padding:16px; text-align:center; margin-bottom:14px; box-shadow: 0 3px 12px rgba(43,38,32,0.07); }
#mh-root .mh-fund-label { font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:4px; }
#mh-root .mh-fund-amount { font-family:'Roboto Mono',monospace; font-size:28px; font-weight:700; }
#mh-root .mh-fund-sub { font-size:10.5px; color:var(--ink-soft); margin-top:4px; }

/* hanging tag cards (signature element) */
#mh-root .mh-rack { margin: 30px 4px 0; position: relative; }
#mh-root .mh-rail {
  height: 5px; border-radius: 4px; position: relative;
  background: linear-gradient(90deg, var(--ink-soft), var(--rule) 8%, var(--rule) 92%, var(--ink-soft));
  box-shadow: 0 2px 3px rgba(43,38,32,0.15);
}
#mh-root .mh-rail::before, #mh-root .mh-rail::after {
  content:''; position:absolute; top:-4px; width:13px; height:13px; border-radius:50%;
  background: var(--ink-soft); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
}
#mh-root .mh-rail::before { left:-2px; }
#mh-root .mh-rail::after { right:-2px; }
#mh-root .mh-tag-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 24px 12px; padding-top: 24px; }
#mh-root .mh-tag {
  position: relative; background: var(--card);
  background-image: linear-gradient(165deg, var(--card-highlight) 0%, var(--card) 55%);
  border: 1px solid var(--rule);
  border-radius: 5px 5px 12px 12px;
  padding: 16px 12px 12px; text-align:center;
  box-shadow: 0 3px 0 rgba(203,191,160,0.35), 0 8px 16px -8px rgba(43,38,32,0.35);
}
#mh-root .mh-tag::before {
  content:''; position:absolute; top:-24px; left:50%; width:2px; height:24px; background: var(--ink-soft); opacity:0.55; transform:translateX(-50%);
}
#mh-root .mh-tag::after {
  content:''; position:absolute; top:-29px; left:50%; width:10px; height:10px; border-radius:50%;
  background: var(--paper); border: 2px solid var(--ink-soft); transform:translateX(-50%);
  box-shadow: 0 1px 2px rgba(43,38,32,0.25);
}
#mh-root .mh-tag-avatar-row { display:flex; align-items:center; gap:9px; margin-bottom:12px; }
#mh-root .mh-tag-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  display:flex; align-items:center; justify-content:center;
  font-family:'Tiro Bangla',serif; font-size:15px; font-weight:700; color:#fff;
  box-shadow: inset 0 -2px 3px rgba(0,0,0,0.15), 0 2px 4px rgba(43,38,32,0.2);
}
#mh-root .mh-tag-name { font-weight:700; font-size:13.5px; text-align:left; line-height:1.2; }
#mh-root .mh-tag-name .mh-tag-archived-badge { display:block; font-size:9.5px; font-weight:600; color: var(--ink-soft); margin-top:1px; }
#mh-root .mh-tag-balance { font-family:'Roboto Mono',monospace; font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:5px; }
#mh-root .mh-tag-balance .mh-arrow { font-size:14px; }
#mh-root .mh-tag-status { font-size:10.5px; margin-top:3px; font-weight:600; letter-spacing:0.2px; }
#mh-root .mh-tag-meta { font-size:10.5px; color: var(--ink-soft); margin-top:10px; display:flex; justify-content:space-between; border-top:1px dashed var(--rule); padding-top:7px; }

/* tables */
#mh-root .mh-table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
#mh-root table.mh-table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 13px; }
#mh-root table.mh-table th, #mh-root table.mh-table td {
  border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule);
  padding: 7px 6px; text-align: center; white-space: nowrap;
}
#mh-root table.mh-table th:last-child, #mh-root table.mh-table td:last-child { border-right: none; }
#mh-root table.mh-table thead th {
  background: var(--paper-dark); font-family:'Tiro Bangla',serif; font-weight:400; font-size:13px; position: sticky; top:0;
}
#mh-root table.mh-table td.mh-date-cell { text-align:left; color: var(--ink-soft); font-family:'Roboto Mono',monospace; font-size:12px; background: var(--paper); }
#mh-root table.mh-table tr.mh-today td { background: #FBF0D6; }
#mh-root table.mh-table tfoot td { background: var(--paper-dark); font-weight:700; font-family:'Roboto Mono',monospace; }
#mh-root .mh-meal-input {
  width: 40px; text-align:center; border:1px solid var(--rule); border-radius:6px; padding:4px 2px;
  font-family:'Roboto Mono',monospace; font-size:13px; background:#fff; color:#111;
}
#mh-root .mh-meal-input:disabled { background: transparent; border-color:transparent; color: var(--ink); }
#mh-root .mh-meal-entry-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 4px; border-bottom:1px solid var(--rule);
}
#mh-root .mh-meal-entry-row:last-child { border-bottom:none; }
#mh-root .mh-meal-entry-who { display:flex; align-items:center; gap:10px; }
#mh-root .mh-meal-entry-avatar {
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:13px; flex-shrink:0;
}
#mh-root .mh-meal-entry-name { font-size:13.5px; font-weight:600; }
#mh-root .mh-meal-entry-input {
  width:64px; text-align:center; border:1px solid var(--rule); border-radius:8px; padding:8px 4px;
  font-family:'Roboto Mono',monospace; font-size:15px; background:#fff; color:#111;
}
#mh-root .mh-meal-entry-total {
  display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding:12px 14px;
  background: var(--paper-dark); border-radius:10px; font-weight:700;
}
#mh-root .mh-meal-entry-total-num { font-family:'Roboto Mono',monospace; font-size:16px; }

/* forms */
#mh-root .mh-form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
#mh-root .mh-field { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
#mh-root .mh-field label { font-size:11.5px; color: var(--ink-soft); font-weight:600; }
#mh-root .mh-field input, #mh-root .mh-field select, #mh-root .mh-field textarea {
  border:1px solid var(--rule); border-radius:8px; padding:9px 10px; font-size:14px; background:#fff; color:#161310;
  font-family:'Hind Siliguri',sans-serif;
}
#mh-root .mh-btn {
  border:none; border-radius:12px; padding:11px 18px; font-weight:700; font-size:13.5px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; justify-content:center; letter-spacing:0.1px;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
}
#mh-root .mh-btn:active { transform: translateY(1.5px); }
#mh-root .mh-btn:disabled { opacity:0.55; cursor:default; transform:none !important; }
#mh-root .mh-btn-primary {
  background: linear-gradient(180deg, var(--green-hi), var(--green));
  color:#fff;
  box-shadow: 0 3px 0 var(--green-shadow), 0 6px 14px rgba(47,111,78,0.25);
}
#mh-root .mh-btn-primary:active { box-shadow: 0 1px 0 var(--green-shadow), 0 2px 6px rgba(47,111,78,0.2); }
#mh-root .mh-btn-ghost {
  background: var(--card); color: var(--ink); border:1.5px solid var(--rule);
  box-shadow: 0 2px 5px rgba(43,38,32,0.06);
}
#mh-root .mh-btn-ghost:active { background: var(--paper-dark); box-shadow:none; }
#mh-root .mh-btn-danger {
  background: var(--rust-soft); color: var(--rust); border:1.5px solid rgba(181,72,47,0.22);
}
#mh-root .mh-btn-danger:active { background: rgba(181,72,47,0.16); }
#mh-root .mh-btn-block { width:100%; }
#mh-root .mh-btn-sm { padding:7px 12px; font-size:12px; border-radius:9px; }

#mh-root .mh-list-row {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 4px; border-bottom:1px solid var(--rule);
}
#mh-root .mh-list-row:last-child { border-bottom:none; }
#mh-root .mh-list-main { font-size:13.5px; font-weight:600; }
#mh-root .mh-list-sub { font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
#mh-root .mh-list-amt { font-family:'Roboto Mono',monospace; font-weight:700; font-size:14px; }
#mh-root .mh-chip { font-size:10.5px; background: var(--green-soft); color:var(--green); padding:2px 8px; border-radius:999px; font-weight:700; }
#mh-root .mh-icon-btn { background:none; border:none; color: var(--ink-soft); font-size:16px; cursor:pointer; padding:6px 8px; border-radius:8px; transition: background 0.15s ease; }
#mh-root .mh-icon-btn:active { background: var(--paper-dark); }

#mh-root .mh-empty { text-align:center; padding:30px 10px; color: var(--ink-soft); font-size:13px; }
#mh-root .mh-empty .mh-serif { font-size:15px; color:var(--ink); display:block; margin-bottom:4px; }

/* modal */
#mh-root .mh-overlay {
  position: fixed; inset:0; background: rgba(20,17,14,0.6); display:flex; align-items:center; justify-content:center;
  z-index: 1000; padding: 20px;
}
#mh-root .mh-modal {
  background: var(--card); border-radius: 14px; padding: 20px; max-width: 340px; width:100%;
  border: 1px solid var(--rule); max-height: 88vh; overflow-y: auto;
}
#mh-root .mh-modal h3 { font-family:'Tiro Bangla',serif; font-size:17px; margin:0 0 4px; }
#mh-root .mh-modal p { font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }
#mh-root .mh-toast {
  position: fixed; bottom: 18px; left:50%; transform:translateX(-50%);
  background: var(--cover); color: var(--gold); padding:10px 18px; border-radius:999px; font-size:12.5px;
  font-weight:600; z-index:1100; box-shadow: 0 6px 18px rgba(0,0,0,0.25); max-width:88vw; text-align:center;
  display:flex; align-items:center; gap:12px;
}
#mh-root .mh-toast-btn {
  background:none; border:none; color: var(--gold); font-weight:700; text-decoration:underline;
  cursor:pointer; font-size:12.5px; padding:0; white-space:nowrap;
}
#mh-root .mh-photo-modal img { display:block; max-height:70vh; object-fit:contain; margin:0 auto; }
#mh-root .mh-note-banner {
  background: #F1DFB4; color: #6B4E1B; border-radius: 10px; padding: 9px 12px;
  font-size: 12px; margin-bottom: 14px; display:flex; gap:8px; align-items:flex-start;
}

/* onboarding */
#mh-root .mh-onboard-hero {
  text-align:center; padding: 30px 16px 22px; margin-bottom: 6px;
  background: var(--cover); background-image: radial-gradient(circle at 50% 0%, #3A3226 0%, #2B2620 70%);
  border-radius: 16px; color: var(--paper);
}
#mh-root .mh-onboard-icon { font-size: 34px; margin-bottom: 8px; }
#mh-root .mh-onboard-title { font-family:'Tiro Bangla',serif; font-size: 20px; color: var(--gold); margin-bottom: 6px; }
#mh-root .mh-onboard-sub { font-size: 12.5px; color: #D8CFB8; max-width: 320px; margin: 0 auto; line-height:1.6; }
#mh-root .mh-welcome { padding: 40px 20px; max-width: 380px; margin: 0 auto; text-align:center; }
#mh-root .mh-welcome-emoji { font-size: 44px; margin-bottom: 10px; }
#mh-root .mh-welcome-title { font-family:'Tiro Bangla',serif; font-size: 24px; color: var(--ink); margin-bottom: 8px; }
#mh-root .mh-welcome-desc { font-size: 13px; color: var(--ink-soft); line-height:1.6; margin-bottom: 6px; }
#mh-root .mh-welcome-recent-title { font-size: 12px; color: var(--ink-soft); font-weight:600; margin: 26px 0 8px; text-align:left; }
#mh-root .mh-welcome-recent-item {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px; text-align:left; font-size:13.5px; font-weight:600;
  cursor: pointer;
}
#mh-root .mh-welcome-recent-right { display:flex; align-items:center; gap:10px; }
#mh-root .mh-welcome-recent-code { font-family:'Roboto Mono',monospace; font-size:11px; color: var(--ink-soft); letter-spacing:1px; }
#mh-root .mh-welcome-recent-x { color: var(--rust); font-size:13px; cursor:pointer; padding:2px 4px; }
#mh-root .mh-chip-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
#mh-root .mh-chip-item {
  display:inline-flex; align-items:center; gap:6px; background: var(--green-soft); color: var(--green);
  border-radius: 999px; padding: 6px 6px 6px 12px; font-size:12.5px; font-weight:600;
}
#mh-root .mh-chip-item button {
  background: rgba(47,111,78,0.15); border:none; color: var(--green); width:18px; height:18px; border-radius:50%;
  font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

/* settings: theme / language segmented toggles */
#mh-root .mh-seg { display:flex; gap:8px; }
#mh-root .mh-seg button {
  flex:1; padding:10px; border-radius:10px; border:1px solid var(--rule); background:var(--card);
  color:var(--ink-soft); font-weight:700; font-size:13px; cursor:pointer;
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
}
#mh-root .mh-seg button.active { background: var(--cover); color: var(--gold); border-color: var(--cover); box-shadow: 0 3px 8px rgba(0,0,0,0.18); }
#mh-root .mh-seg button:active { transform: translateY(1px); }
#mh-root .mh-history-row { display:flex; justify-content:space-between; font-size:12px; padding:7px 0; border-bottom:1px dashed var(--rule); }
#mh-root .mh-history-row:last-child { border-bottom:none; }
#mh-root .mh-history-row .mh-h-name { font-weight:700; }
#mh-root .mh-history-row .mh-h-date { color: var(--ink-soft); }

/* print report (hidden on screen, shown only when printing) */
#mh-root .mh-print-only { display:none; }
.mh-print-report { font-family:'Hind Siliguri',sans-serif; color:#111; background:#fff; padding:12px; }
.mh-print-report h1 { font-family:'Tiro Bangla',serif; font-size:20px; margin:0 0 4px; }
.mh-print-report .mh-print-meta { font-size:12px; color:#333; margin-bottom:16px; line-height:1.6; }
.mh-print-report table { width:100%; border-collapse:collapse; margin-bottom:18px; font-size:12px; }
.mh-print-report th, .mh-print-report td { border:1px solid #999; padding:5px 7px; text-align:left; }
.mh-print-report th { background:#eee; }
.mh-print-report .mh-print-section-title { font-family:'Tiro Bangla',serif; font-size:14px; margin:16px 0 6px; }
.mh-print-report .mh-print-signature-row { display:flex; justify-content:flex-end; margin-top:56px; }
.mh-print-report .mh-print-signature-box { width:220px; text-align:center; }
.mh-print-report .mh-print-signature-line { border-top:1px solid #333; margin-bottom:6px; }
.mh-print-report .mh-print-signature-label { font-size:12px; color:#333; }
.mh-print-report .mh-print-meal-title { font-family:'Tiro Bangla',serif; font-size:15px; margin:0 0 10px; }
.mh-print-report table.mh-print-meal-table { font-size:8px; margin-bottom:0; }
.mh-print-report table.mh-print-meal-table th, .mh-print-report table.mh-print-meal-table td { padding:2px 3px; text-align:center; }
.mh-print-report table.mh-print-meal-table th:first-child, .mh-print-report table.mh-print-meal-table td:first-child { text-align:left; }
.mh-print-report table.mh-print-meal-table tfoot td { font-weight:700; background:#f3f3f3; }
#mh-root .mh-thumb { width:34px; height:34px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid var(--rule); }
@media print {
  body > *:not(#mh-print-report) { display: none !important; }
  #mh-print-report { display: block !important; margin:0; }
  .mh-print-meal-page { page-break-before: always; }
  .mh-print-meal-page table { page-break-inside: avoid; }
}

@media (max-width: 380px) {
  #mh-root .mh-stat-strip { grid-template-columns: repeat(2,1fr); }
}

/* ---------------- LOCAL STORAGE POLYFILL ----------------
   এই অ্যাপটি মূলত Claude.ai-এর window.storage API এর জন্য বানানো হয়েছিল,
   যা শুধু Claude-এর নিজস্ব পরিবেশে কাজ করে। সাধারণ ব্রাউজারে স্বাধীনভাবে
   চালানোর জন্য নিচে ব্রাউজারের localStorage দিয়ে সেই একই API তৈরি করা হলো,
   যাতে ডেটা সেভ/লোড, পিন সেটআপ, এডমিন লগইন সব ঠিকভাবে কাজ করে।
---------------------------------------------------------- */
if(!window.storage){
  window.storage = (function(){
    function fullKey(key, shared){ return 'messhishab-store:' + (shared ? 'shared' : 'local') + ':' + key; }
    return {
      get: function(key, shared){
        return new Promise(function(resolve){
          try {
            var raw = localStorage.getItem(fullKey(key, shared));
            if(raw === null || raw === undefined){ resolve(null); return; }
            resolve({ key: key, value: raw, shared: !!shared });
          } catch(e){ resolve(null); }
        });
      },
      set: function(key, value, shared){
        return new Promise(function(resolve){
          try {
            localStorage.setItem(fullKey(key, shared), value);
            resolve({ key: key, value: value, shared: !!shared });
          } catch(e){ resolve(null); }
        });
      },
      "delete": function(key, shared){
        return new Promise(function(resolve){
          try {
            localStorage.removeItem(fullKey(key, shared));
            resolve({ key: key, deleted: true, shared: !!shared });
          } catch(e){ resolve(null); }
        });
      },
      list: function(prefix, shared){
        return new Promise(function(resolve){
          try {
            var basePre = 'messhishab-store:' + (shared ? 'shared' : 'local') + ':';
            var pre = basePre + (prefix || '');
            var keys = [];
            for(var i=0;i<localStorage.length;i++){
              var k = localStorage.key(i);
              if(k && k.indexOf(pre) === 0){ keys.push(k.slice(basePre.length)); }
            }
            resolve({ keys: keys, prefix: prefix, shared: !!shared });
          } catch(e){ resolve(null); }
        });
      }
    };
  })();
}

}

  return (r % 1 === 0) ? r.toLocaleString('en-US') : r.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtInt(n){ if(n===null||n===undefined||isNaN(n)) n=0; var r = Math.round(n*100)/100; return (r % 1 === 0) ? String(r) : r.toFixed(2); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

}
function formatLogTime(iso){

  } catch(e){ return ''; }
}

function compressImageFile(file, maxWidth, quality){
  return new Promise(function(resolve, reject){
    if(!file) { resolve(null); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function defaultData(){
  return { messName: '', managerId: '', managerHistory: [], members: [], meals: {}, bazar: [], expenses: [], deposits: [], activityLog: [] };
}

function findMemberById(id){
  if(!id) return null;
  var f = S.data.members.filter(function(m){ return m.id === id; });
  return f[0] || null;
}
function activeMembers(){ return S.data.members.filter(function(m){ return m.active !== false; }); }
function archivedMembers(){ return S.data.members.filter(function(m){ return m.active === false; }); }
function archivedMembersForMonth(ym){
  return archivedMembers().filter(function(m){
    var hasMeal = Object.keys(S.data.meals).some(function(date){
      return date.indexOf(ym) === 0 && S.data.meals[date][m.id] !== undefined;
    });
    if(hasMeal) return true;
    var hasDeposit = S.data.deposits.some(function(d){ return d.date.indexOf(ym) === 0 && d.memberId === m.id; });
    if(hasDeposit) return true;
    var hasBazar = S.data.bazar.some(function(b){ return b.date.indexOf(ym) === 0 && b.memberId === m.id; });
    return hasBazar;
  });
}

/* members relevant to a given month: everyone currently active,
   plus anyone archived who still has meal/deposit records that month
   (so past data always stays visible even after someone leaves) */
function membersForMonth(ym){
  var byId = {};
  activeMembers().forEach(function(m){ byId[m.id] = m; });
  Object.keys(S.data.meals).forEach(function(date){
    if(date.indexOf(ym) !== 0) return;
    Object.keys(S.data.meals[date]).forEach(function(mid){
      if(byId[mid]) return;
      var mem = findMemberById(mid);
      if(mem) byId[mid] = mem;
    });
  });
  S.data.deposits.forEach(function(d){
    if(d.date.indexOf(ym) !== 0) return;
    if(byId[d.memberId]) return;
    var mem = findMemberById(d.memberId);
    if(mem) byId[d.memberId] = mem;
  });
  var order = {};
  S.data.members.forEach(function(m,i){ order[m.id] = i; });
  return Object.keys(byId).map(function(id){ return byId[id]; })
    .sort(function(a,b){ return order[a.id] - order[b.id]; });
}

function isSetupComplete(){
  return !!(S.data && S.data.messName && S.data.messName.trim() && S.data.members && S.data.members.length > 0);
}

function normalizeData(){
  if(!S.data) S.data = defaultData();
  if(typeof S.data.messName !== 'string') S.data.messName = '';
  if(typeof S.data.managerId !== 'string') S.data.managerId = '';
  if(!Array.isArray(S.data.managerHistory)) S.data.managerHistory = [];
  if(!Array.isArray(S.data.members)) S.data.members = [];
  if(!S.data.meals || typeof S.data.meals !== 'object') S.data.meals = {};
  if(!Array.isArray(S.data.bazar)) S.data.bazar = [];
  if(!Array.isArray(S.data.expenses)) S.data.expenses = [];
  if(!Array.isArray(S.data.deposits)) S.data.deposits = [];
  if(!Array.isArray(S.data.activityLog)) S.data.activityLog = [];
}

async function loadAll(){
  try {
    var data = await remoteGetData();
    S.data = data || defaultData();
  } catch(e){
    S.data = defaultData();
  }
  normalizeData();
  var sharedPin = null;
  try {
    sharedPin = await remoteGetPin();
    S.pinExists = !!sharedPin;
  } catch(e){ S.pinExists = false; }
  try {
    var localRes = await window.storage.get(localAdminKeyFor(S.messCode), false);
    var localPin = localRes && localRes.value ? localRes.value : null;
    S.isAdmin = !!(localPin && sharedPin && localPin === sharedPin);
  } catch(e){ S.isAdmin = false; }
  try {
    var langRes = await window.storage.get(LANG_KEY, false);
    if(langRes && (langRes.value === 'bn' || langRes.value === 'en')) S.lang = langRes.value;
  } catch(e){}
  try {
    var themeRes = await window.storage.get(THEME_KEY, false);
    if(themeRes && (themeRes.value === 'light' || themeRes.value === 'dark')) S.theme = themeRes.value;
  } catch(e){}
  try {
    var remRes = await window.storage.get(REMINDER_KEY, false);
    if(remRes && remRes.value){
      var parsed = JSON.parse(remRes.value);
      if(parsed && typeof parsed === 'object') S.reminder = Object.assign({ enabled:false, time:'20:00', lastFiredDate:null }, parsed);
    }
  } catch(e){}
  try {
    var idRes = await window.storage.get(localIdentityKeyFor(S.messCode), false);
    S.localIdentityId = idRes && idRes.value ? idRes.value : null;
  } catch(e){ S.localIdentityId = null; }
  S.loaded = true;
  S.lastSync = new Date();
}

/* re-checks that this device's saved pin still matches the live admin pin
   (handles monthly manager handover: old device auto-drops to view mode) */
async function revalidateAdmin(){
  try {
    var sharedPin = await remoteGetPin();
    var localRes = await window.storage.get(localAdminKeyFor(S.messCode), false);
    var localPin = localRes && localRes.value ? localRes.value : null;
    S.pinExists = !!sharedPin;
    var stillAdmin = !!(localPin && sharedPin && localPin === sharedPin);
    if(S.isAdmin && !stillAdmin){
      S.isAdmin = false;
      showToast(t('admin.changedElsewhere'));
      render();
    } else if(!S.isAdmin && stillAdmin){
      S.isAdmin = true;
      render();
    }
  } catch(e){}
}

async function saveData(){

    S.lastSync = new Date();
    return true;
  } catch(e){
    showToast(t('toast.saveFailed'));

/* Fallback for when Firebase isn't configured (e.g. running without a mess code) */
async function pollForUpdates(){
  if(!S.loaded) return;
  var active = document.activeElement;
  if(active && active.tagName === 'INPUT' && active.classList.contains('mh-live-guard')) return;
  try {
    var fresh = await remoteGetData();
    if(fresh && JSON.stringify(fresh) !== JSON.stringify(S.data)){
      S.data = fresh;
      normalizeData();
      S.lastSync = new Date();
      render();
    } else {
      updateSyncLabel();
    }
  } catch(e){}
  if(!document.getElementById('mh-overlay')) revalidateAdmin();
}

/* True real-time sync via Firebase listeners, used whenever a mess code + Firebase are available */
var _fbListenersOn = false;
function attachLiveListeners(){
  if(!fbDb || !S.messCode || _fbListenersOn) return;
  _fbListenersOn = true;
  messRef('data').on('value', function(snap){
    if(!S.loaded) return;
    var active = document.activeElement;
    if(active && active.tagName === 'INPUT' && active.classList.contains('mh-live-guard')) return;
    var fresh = snap.exists() ? snap.val() : null;
    if(!fresh) return;
    if(JSON.stringify(fresh) !== JSON.stringify(S.data)){
      S.data = fresh;
      normalizeData();
      S.lastSync = new Date();
      render();
    } else {
      S.lastSync = new Date();
      updateSyncLabel();
    }
  });
  messRef('pin').on('value', function(){
    if(!document.getElementById('mh-overlay')) revalidateAdmin();
  });
}

function showToast(msg, actionLabel, actionCallback){
  var old = document.getElementById('mh-toast');

  var el = document.createElement('div');
  el.id = 'mh-toast';
  el.className = 'mh-toast';
  var span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(actionLabel && typeof actionCallback === 'function'){
    var btn = document.createElement('button');

}

/* ---------------- CALC ---------------- */
function calcMonth(ym){
  var members = membersForMonth(ym);
  var perMember = {};
  members.forEach(function(m){ perMember[m.id] = { meals: 0, deposit: 0 }; });

  Object.keys(S.data.meals).forEach(function(date){
    if(date.indexOf(ym) !== 0) return;
    var row = S.data.meals[date];
    Object.keys(row).forEach(function(mid){
      if(!perMember[mid]) return;
      perMember[mid].meals += (parseFloat(row[mid]) || 0);
    });
  });

  var totalCost = 0;
  S.data.bazar.forEach(function(b){ if(b.date.indexOf(ym) === 0) totalCost += (parseFloat(b.amount) || 0); });

  S.data.deposits.forEach(function(d){
    if(d.date.indexOf(ym) !== 0) return;
    if(!perMember[d.memberId]) return;
    var damt = parseFloat(d.amount) || 0;
    if(d.type === 'refund') damt = -damt;
    perMember[d.memberId].deposit += damt;
  });

  var totalMeals = 0;
  members.forEach(function(m){ totalMeals += perMember[m.id].meals; });
  var rate = totalMeals > 0 ? totalCost / totalMeals : 0;

  var totalOther = 0;
  S.data.expenses.forEach(function(x){ if(x.date.indexOf(ym) === 0) totalOther += (parseFloat(x.amount) || 0); });
  var activeIds = {};
  activeMembers().forEach(function(m){ activeIds[m.id] = true; });
  var activeCount = activeMembers().length;
  var otherShare = activeCount > 0 ? totalOther / activeCount : 0;

  members.forEach(function(m){
    var pm = perMember[m.id];
    pm.mealCost = pm.meals * rate;
    pm.otherShare = activeIds[m.id] ? otherShare : 0;
    pm.cost = pm.mealCost + pm.otherShare;
    pm.balance = pm.deposit - pm.cost;
  });

  var totalDeposit = 0;
  members.forEach(function(m){ totalDeposit += perMember[m.id].deposit; });

  var totalRemaining = totalDeposit - (totalCost + totalOther);

  return {
    members: members, perMember: perMember, totalMeals: totalMeals, totalCost: totalCost, rate: rate,
    totalOther: totalOther, otherShare: otherShare, activeCount: activeCount,
    totalDeposit: totalDeposit, totalRemaining: totalRemaining
  };
}

async function getRecentMesses(){
  try {
    var res = await window.storage.get(RECENT_KEY, false);
    if(res && res.value){ var arr = JSON.parse(res.value); if(Array.isArray(arr)) return arr; }
  } catch(e){}
  return [];
}
async function addRecentMess(code, name){
  try {
    var list = await getRecentMesses();
    list = list.filter(function(r){ return r.code !== code; });
    list.unshift({ code: code, name: name });
    if(list.length > 8) list = list.slice(0, 8);
    await window.storage.set(RECENT_KEY, JSON.stringify(list), false);
  } catch(e){}
}
async function removeRecentMess(code, ev){
  if(ev) ev.stopPropagation();
  try {
    var list = await getRecentMesses();
    list = list.filter(function(r){ return r.code !== code; });
    await window.storage.set(RECENT_KEY, JSON.stringify(list), false);
  } catch(e){}
  renderWelcome();
}
function openRecentMess(code){

}

  var tries = 0;
  while(await checkCodeExists(code) && tries < 6){ code = genMessCode(); tries++; }

    el.textContent = secs + t('sync.agoSuffix');
  } else if(secs < 3600){
    el.textContent = Math.floor(secs/60) + t('sync.minAgoSuffix');

/* ---------------- REFUND (surplus payback) ---------------- */
function openRefundModal(memberId){
  var mem = findMemberById(memberId);
  if(!mem) return;
  var c = calcMonth(S.ym);
  var pm = c.perMember[memberId];
  var maxAmt = pm ? Math.max(0, Math.round(pm.balance * 100) / 100) : 0;
  var overlay = ensureOverlay();
  var html = '<div class="mh-modal"><h3>' + t('dashboard.refundModalTitle') + '</h3>';
  html += '<p>' + escapeHtml(mem.name) + ' &mdash; ' + t('dashboard.refundModalDesc') + ' (৳' + fmtNum(maxAmt) + ')</p>';
  html += '<div class="mh-field"><label>' + t('deposits.dateLabel') + '</label><input id="mh-refund-date" type="date" value="' + todayStr() + '"></div>';
  html += '<div class="mh-field"><label>' + t('deposits.amountLabel') + '</label><input id="mh-refund-amount" type="number" min="0" step="0.01" max="' + maxAmt + '" value="' + (maxAmt > 0 ? maxAmt : '') + '"></div>';
  html += '<div class="mh-field"><label>' + t('deposits.noteLabel') + '</label><input id="mh-refund-note" type="text" placeholder="' + t('deposits.refundNotePlaceholder') + '"></div>';
  html += '<button class="mh-btn mh-btn-primary mh-btn-block" onclick="MH.confirmRefund(\'' + memberId + '\')">' + t('dashboard.refundBtn') + '</button>';
  html += '<button class="mh-btn mh-btn-ghost mh-btn-block" style="margin-top:8px;" onclick="MH.closeModal()">' + t('common.cancelBtn') + '</button></div>';
  overlay.innerHTML = html;
}

async function confirmRefund(memberId){
  var dateEl = document.getElementById('mh-refund-date');
  var amountEl = document.getElementById('mh-refund-amount');
  var noteEl = document.getElementById('mh-refund-note');
  var date = dateEl && dateEl.value ? dateEl.value : todayStr();
  var amount = parseFloat(amountEl ? amountEl.value : '');
  var note = noteEl ? noteEl.value.trim() : '';
  if(!amount || amount <= 0){ showToast(t('toast.amountInvalid')); return; }
  S.data.deposits.push({ id: uid(), memberId: memberId, date: date, amount: amount, note: note, type: 'refund' });
  var mem = findMemberById(memberId);
  logActivity('refund_add', (mem ? mem.name : '') + ' ৳' + fmtNum(amount));
  var ok = await saveData();
  closeModal();
  if(ok){ render(); showToast(t('toast.refundAdded')); }
}

function renderMealsChart(){
  var members = membersForMonth(S.ym);
  var days = daysInMonth(S.ym);
  var today = todayStr();
  var weekdays = S.lang === 'en' ? EN_WEEKDAYS : BN_WEEKDAYS;
  var html = '';
  html += '<div class="mh-table-wrap"><table class="mh-table"><thead><tr><th style="text-align:left;">' + t('meals.date') + '</th>';
  members.forEach(function(m){ html += '<th>' + escapeHtml(m.name) + (m.active === false ? ' *' : '') + '</th>'; });
  html += '<th>' + t('meals.total') + '</th></tr></thead><tbody>';

  var colTotals = {};
  members.forEach(function(m){ colTotals[m.id] = 0; });
  var grandTotal = 0;

  for(var d=1; d<=days; d++){
    var date = S.ym + '-' + pad2(d);
    var dow = new Date(S.ym.split('-')[0], parseInt(S.ym.split('-')[1],10)-1, d).getDay();
    var row = S.data.meals[date] || {};
    var rowTotal = 0;
    html += '<tr class="' + (date===today?'mh-today':'') + '">';
    html += '<td class="mh-date-cell">' + d + ' ' + weekdays[dow] + '</td>';
    members.forEach(function(m){
      var val = row[m.id] !== undefined ? row[m.id] : '';
      rowTotal += (parseFloat(val) || 0);
      colTotals[m.id] += (parseFloat(val) || 0);
      if(S.isAdmin && m.active !== false){
        html += '<td><input class="mh-meal-input" type="number" min="0" step="0.5" inputmode="decimal" enterkeyhint="next" value="' + (val===''?'':val) + '" placeholder="0" data-date="' + date + '" data-member="' + m.id + '" onchange="MH.updateMeal(this)"></td>';
      } else {
        html += '<td>' + (val === '' ? '&mdash;' : fmtInt(val)) + '</td>';
      }
    });
    grandTotal += rowTotal;
    html += '<td class="mh-mono" style="font-family:Roboto Mono,monospace;">' + fmtInt(rowTotal) + '</td>';
    html += '</tr>';
  }

  if(members.some(function(m){ return m.active === false; })){
    html += '</tbody><tfoot><tr><td colspan="' + (members.length+2) + '" style="text-align:left;font-weight:400;font-size:11px;color:var(--ink-soft);background:var(--paper);">' + t('meals.archivedNote') + '</td></tr>';
  } else {
    html += '</tbody><tfoot>';
  }
  html += '<tr><td style="text-align:left;">' + t('meals.totalMeals') + '</td>';
  members.forEach(function(m){ html += '<td>' + fmtInt(colTotals[m.id]) + '</td>'; });
  html += '<td>' + fmtInt(grandTotal) + '</td></tr></tfoot>';
  html += '</table></div>';
  return html;
}

/* ---------------- ONBOARDING ACTIONS ---------------- */
function syncOnboardName(input){ S.onboardName = input.value; }

function addOnboardMember(){
  var input = document.getElementById('mh-ob-member-input');
  var name = input.value.trim();
  if(!name) return;
  S.onboardMembers.push(name);
  input.value = '';
  refreshOnboardMemberUI();
  input.focus();
}
function removeOnboardMember(i){
  S.onboardMembers.splice(i, 1);
  refreshOnboardMemberUI();
}

async function finishOnboarding(){
  var nameInput = document.getElementById('mh-ob-name');
  var name = nameInput ? nameInput.value.trim() : S.onboardName.trim();
  if(!name){ showToast(t('onboard.needName')); return; }
  if(S.onboardMembers.length === 0){ showToast(t('onboard.needMember')); return; }

  var managerSelect = document.getElementById('mh-ob-manager-select');
  if(!managerSelect){ showToast(t('onboard.needManager')); return; }
  var managerIndex = parseInt(managerSelect.value, 10);

  var pinVal = null;
  if(!S.pinExists){
    var pinInput = document.getElementById('mh-ob-pin');
    pinVal = pinInput ? pinInput.value.trim() : '';
    if(pinVal.length < 4){ showToast(t('onboard.pinTooShort')); return; }
  }

  S.data.messName = name;
  var newMembers = S.onboardMembers.map(function(n, i){
    return { id: uid(), name: n, color: MEMBER_COLORS[i % MEMBER_COLORS.length], active: true };
  });
  S.data.members = newMembers;
  var manager = newMembers[managerIndex] || newMembers[0];
  S.data.managerId = manager.id;
  S.data.managerHistory.push({ name: manager.name, date: todayStr() });

  var ok = await saveData();
  if(!ok) return;

  if(pinVal){
    try {
      await remoteSetPin(pinVal);
      await window.storage.set(localAdminKeyFor(S.messCode), pinVal, false);
      S.pinExists = true; S.isAdmin = true;
    } catch(e){ showToast(t('admin.problemToast')); }
  }

  S.onboardMembers = []; S.onboardName = '';
  render();
  showToast(name + t('onboard.doneToastSuffix'));
  maybeShowLoginGate();
}

    overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });

async function submitLogin(){
  var phoneEl = document.getElementById('mh-login-phone');
  var passEl = document.getElementById('mh-login-password');
  var phone = phoneEl ? phoneEl.value.trim() : '';
  var password = passEl ? passEl.value.trim() : '';
  if(!phone || !password){ showToast(t('login.needBoth')); return; }
  var match = S.data.members.filter(function(m){
    return m.phone && m.phone.trim() === phone && m.password && m.password === password;
  })[0];
  if(!match){ showToast(t('login.wrongCreds')); return; }
  S.localIdentityId = match.id;
  try { await window.storage.set(localIdentityKeyFor(S.messCode), match.id, false); } catch(e){}
  S.modalLocked = false;
  closeModal(true);
  render();
  showToast(match.name + t('login.welcomeSuffix'));
}

async function logoutIdentity(){
  S.localIdentityId = null;
  try { await window.storage.set(localIdentityKeyFor(S.messCode), '', false); } catch(e){}
  render();
  openLoginModal(true);
}

async function updateMeal(input){
  var date = input.getAttribute('data-date');
  var memberId = input.getAttribute('data-member');
  var val = input.value;
  if(!S.data.meals[date]) S.data.meals[date] = {};
  if(val === ''){ delete S.data.meals[date][memberId]; }
  else { S.data.meals[date][memberId] = parseFloat(val); }
  var ok = await saveData();
  if(ok) render();
}

async function applyBulkMeal(date){
  var input = document.getElementById('mh-meal-bulk-value');
  var raw = input ? input.value.trim() : '';
  if(raw === '' || isNaN(parseFloat(raw)) || parseFloat(raw) < 0){ showToast(t('toast.amountInvalid')); return; }
  var val = parseFloat(raw);
  var entryYm = date.slice(0,7);
  var members = membersForMonth(entryYm).filter(function(m){ return m.active !== false; });
  if(members.length === 0) return;
  if(!window.confirm(t('meals.bulkConfirmA') + val + t('meals.bulkConfirmB'))) return;
  if(!S.data.meals[date]) S.data.meals[date] = {};
  members.forEach(function(m){ S.data.meals[date][m.id] = val; });
  var ok = await saveData();
  if(ok){ render(); showToast(t('meals.bulkAppliedToast')); }
}

async function addBazar(){
  var date = document.getElementById('mh-bazar-date').value || todayStr();
  var memberId = document.getElementById('mh-bazar-member').value;
  var item = document.getElementById('mh-bazar-item').value.trim();
  var amount = parseFloat(document.getElementById('mh-bazar-amount').value);
  if(!amount || amount <= 0){ showToast(t('toast.amountInvalid')); return; }
  var photoInput = document.getElementById('mh-bazar-photo');
  var photo = null;
  if(photoInput && photoInput.files && photoInput.files[0]){
    try { photo = await compressImageFile(photoInput.files[0], 700, 0.6); } catch(e){ photo = null; }
  }
  var entry = { id: uid(), date: date, memberId: memberId, item: item, amount: amount };
  if(photo) entry.photo = photo;
  S.data.bazar.push(entry);
  var mem = findMemberById(memberId);
  logActivity('bazar_add', (item || '') + ' \u09f3' + fmtNum(amount) + (mem ? ' \u00b7 ' + mem.name : ''));
  var ok = await saveData();
  if(ok){ render(); showToast(t('toast.bazarAdded')); }
  else if(photo){
    S.data.bazar.pop();
    delete entry.photo;
    S.data.bazar.push(entry);
    S.data.activityLog.shift();
    logActivity('bazar_add', (item || '') + ' \u09f3' + fmtNum(amount) + (mem ? ' \u00b7 ' + mem.name : ''));
    var ok2 = await saveData();
    if(ok2){ render(); showToast(t('common.photoTooBig')); }
  }
}
async function deleteBazar(id){
  var idx = -1;

    var perm = Notification.permission;
    if(perm !== 'granted'){
      perm = await Notification.requestPermission();

      showToast(t('settings.reminderPermissionDenied'));

function checkReminder(){
  if(!S.reminder || !S.reminder.enabled) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  var now = new Date();
  var hh = pad2(now.getHours()), mm = pad2(now.getMinutes());
  var today = todayStr();
  if((hh + ':' + mm) === S.reminder.time && S.reminder.lastFiredDate !== today){
    try { new Notification(t('settings.reminderNotifTitle'), { body: t('settings.reminderNotifBody') }); } catch(e){}
    S.reminder.lastFiredDate = today;
    saveReminderSettings();
  }
}

function buildPrintMealChart(){
  var members = membersForMonth(S.ym);
  var days = daysInMonth(S.ym);
  var weekdays = S.lang === 'en' ? EN_WEEKDAYS : BN_WEEKDAYS;
  var html = '<div class="mh-print-report mh-print-meal-page" id="mh-print-page-mealchart">';
  html += '<div class="mh-print-meal-title">' + escapeHtml(S.data.messName || t('app.defaultName')) + ' &mdash; ' + t('print.mealChartTitle') + ' &middot; ' + ymLabel(S.ym) + '</div>';
  html += '<table class="mh-print-meal-table"><thead><tr><th>' + t('meals.date') + '</th>';
  members.forEach(function(m){ html += '<th>' + escapeHtml(m.name) + (m.active === false ? ' *' : '') + '</th>'; });
  html += '<th>' + t('meals.total') + '</th></tr></thead><tbody>';

  var colTotals = {};
  members.forEach(function(m){ colTotals[m.id] = 0; });
  var grandTotal = 0;

  for(var d=1; d<=days; d++){
    var date = S.ym + '-' + pad2(d);
    var dow = new Date(S.ym.split('-')[0], parseInt(S.ym.split('-')[1],10)-1, d).getDay();
    var row = S.data.meals[date] || {};
    var rowTotal = 0;
    html += '<tr><td>' + d + ' ' + weekdays[dow] + '</td>';
    members.forEach(function(m){
      var val = row[m.id] !== undefined ? row[m.id] : '';
      rowTotal += (parseFloat(val) || 0);
      colTotals[m.id] += (parseFloat(val) || 0);
      html += '<td>' + (val === '' ? '&mdash;' : fmtInt(val)) + '</td>';
    });
    grandTotal += rowTotal;
    html += '<td>' + fmtInt(rowTotal) + '</td></tr>';
  }

  html += '</tbody><tfoot><tr><td>' + t('meals.totalMeals') + '</td>';
  members.forEach(function(m){ html += '<td>' + fmtInt(colTotals[m.id]) + '</td>'; });
  html += '<td>' + fmtInt(grandTotal) + '</td></tr></tfoot>';
  html += '</table></div>';
  return html;
}

async function downloadReportPDF(){
  var btn = document.getElementById('mh-pdf-btn');
  var originalLabel = btn ? btn.textContent : '';
  try {
    if(typeof html2canvas === 'undefined' || !window.jspdf){
      alert(t('settings.pdfError'));
      return;
    }
    if(btn){ btn.textContent = t('settings.pdfGenerating'); btn.disabled = true; }
    buildPrintReport();
    var container = document.getElementById('mh-print-report');
    var summaryEl = document.getElementById('mh-print-page-summary');
    var mealEl = document.getElementById('mh-print-page-mealchart');
    if(!container || !summaryEl) return;

    var prevCss = container.getAttribute('style') || '';
    container.style.cssText = 'display:block !important; position:fixed; left:-99999px; top:0; z-index:-1; background:#fff;';
    summaryEl.style.width = '794px';
    if(mealEl) mealEl.style.width = '794px';

    var jsPDFCtor = window.jspdf.jsPDF;
    var pdf = new jsPDFCtor({ unit:'pt', format:'a4', orientation:'portrait' });

    function addCanvasPage(canvas, isFirst, orientation){
      if(!isFirst) pdf.addPage('a4', orientation);
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var scale = Math.min(pageW / canvas.width, pageH / canvas.height);
      var w = canvas.width * scale, h = canvas.height * scale;
      var x = (pageW - w) / 2, y = (pageH - h) / 2;
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', x, y, w, h);
    }

    var canvas1 = await html2canvas(summaryEl, { scale:2, backgroundColor:'#ffffff' });
    addCanvasPage(canvas1, true, 'portrait');

    if(mealEl){
      var canvas2 = await html2canvas(mealEl, { scale:2, backgroundColor:'#ffffff' });
      addCanvasPage(canvas2, false, 'portrait');
    }

    container.setAttribute('style', prevCss);
    summaryEl.style.width = '';
    if(mealEl) mealEl.style.width = '';

    var fname = (S.data.messName || t('app.defaultName')) + '-' + S.ym + '.pdf';
    pdf.save(fname);
  } catch(err){
    alert(t('settings.pdfError'));
  } finally {
    if(btn){ btn.textContent = originalLabel; btn.disabled = false; }
  }
}
function printReport(){
  buildPrintReport();
  var report = document.getElementById('mh-print-report');
  if(!report){ window.print(); return; }
  var placeholder = document.createComment('mh-print-report-slot');
  var originalParent = report.parentNode;
  originalParent.insertBefore(placeholder, report);
  document.body.appendChild(report);
  var restored = false;
  function restore(){
    if(restored) return;
    restored = true;
    if(report.parentNode === document.body){
      if(placeholder.parentNode){
        placeholder.parentNode.insertBefore(report, placeholder);
        placeholder.parentNode.removeChild(placeholder);
      } else {
        document.body.removeChild(report);
      }
    }
    window.removeEventListener('afterprint', restore);
  }
  window.addEventListener('afterprint', restore);
  setTimeout(function(){ window.print(); }, 60);
  setTimeout(restore, 4000);
}

function initSwipeNav(){
  var shell = document.getElementById('mh-shell');
  if(!shell) return;
  var startX = null, startY = null;
  shell.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    var target = e.target;
    if(target.closest && (target.closest('#mh-bottom-nav') || target.closest('.mh-table-wrap') || target.closest('input') || target.closest('select') || target.closest('textarea'))){
      startX = null; startY = null; return;
    }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  shell.addEventListener('touchend', function(e){
    if(startX === null) return;
    var touch = e.changedTouches[0];
    var dx = touch.clientX - startX;
    var dy = touch.clientY - startY;
    startX = null; startY = null;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    var idx = TAB_ORDER.indexOf(S.tab);
    if(idx === -1) return;
    if(dx < 0 && idx < TAB_ORDER.length - 1){ setTab(TAB_ORDER[idx + 1]); }
    else if(dx > 0 && idx > 0){ setTab(TAB_ORDER[idx - 1]); }
  }, { passive: true });
}
function shiftMonth(delta){
  var p = S.ym.split('-'); var y = parseInt(p[0],10), m = parseInt(p[1],10);
  m += delta;
  if(m < 1){ m = 12; y -= 1; } else if(m > 12){ m = 1; y += 1; }
  S.ym = y + '-' + pad2(m);
  render();
}

function attachGlobalHandlers(){
  function wireEnterAdvance(selector){
    var inputs = Array.prototype.slice.call(document.querySelectorAll(selector));
    inputs.forEach(function(el, idx){
      el.classList.add('mh-live-guard');
      el.setAttribute('tabindex', String(idx + 1));
      el.onkeydown = function(e){
        if(e.key === 'Enter' || e.key === 'Tab'){
          e.preventDefault();
          var next = inputs[idx + 1];
          if(next){
            mhPendingFocus = { date: next.getAttribute('data-date'), member: next.getAttribute('data-member') };
            next.focus(); if(next.select) next.select();
          } else {
            mhPendingFocus = null;
            el.blur();
          }
        }
      };
    });
  }
  wireEnterAdvance('.mh-meal-input');
  wireEnterAdvance('input.mh-meal-entry-input');
}
